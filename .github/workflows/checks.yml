name: CASHVERSE v1 checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashverse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smoke_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test transaction amounts and fee calculations
        run: npm test
      - name: Test working API against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:smoke_password@127.0.0.1:5432/cashverse
          OWNER_PASSWORD: test-owner-password-12345
          SESSION_SECRET: test-long-random-session-secret-1234567890abcdef
          PORT: '3000'
        run: |
          npm start > /tmp/cashverse.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health || (cat /tmp/cashverse.log; exit 1)
          node test/smoke.js
